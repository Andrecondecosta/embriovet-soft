# Render Blueprint para EquiCore
# Este arquivo configura automaticamente os serviços no Render

services:
  # Banco de dados PostgreSQL
  - type: pserv
    name: embriovet-db
    env: docker
    plan: free
    ipAllowList: []

  # Aplicação: app nova (FastAPI + React); EQUICORE_APP=streamlit volta à antiga
  - type: web
    name: embriovet-app
    env: python
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.17.0
      - key: DB_HOST
        fromDatabase:
          name: embriovet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: embriovet-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: embriovet-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: embriovet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: embriovet-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: embriovet-db
          property: connectionString